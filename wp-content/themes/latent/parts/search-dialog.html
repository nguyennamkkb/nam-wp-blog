<!-- wp:html -->
<dialog id="latent-search" class="latent-search" data-state="idle" aria-labelledby="latent-search-title">
	<div class="latent-search__panel">
		<h2 id="latent-search-title" class="screen-reader-text">Tìm kiếm bài viết</h2>

		<div class="latent-search__field">
			<svg class="latent-search__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>

			<label class="screen-reader-text" for="latent-search-input">Tìm bài viết…</label>
			<input id="latent-search-input" class="latent-search__input" type="search" placeholder="Tìm bài viết…" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="latent-search-results" aria-autocomplete="list" aria-describedby="latent-search-hint" />

			<button type="button" class="latent-search__close" aria-label="Đóng tìm kiếm">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
			</button>
		</div>

		<p id="latent-search-status" class="latent-search__status" role="status" aria-live="polite">Nhập ít nhất 2 ký tự để tìm bài viết.</p>

		<ul id="latent-search-results" class="latent-search__results" role="listbox" aria-label="Kết quả tìm kiếm" hidden></ul>

		<p id="latent-search-hint" class="latent-search__hint"><kbd>↑</kbd><kbd>↓</kbd> chọn · <kbd>Enter</kbd> mở · <kbd>Esc</kbd> đóng</p>
	</div>
</dialog>
<!-- /wp:html -->
